site_name: Présidentielle 2027 – Wiki
site_url: https://venglow123.github.io/presidentielle-2027/
repo_url: https://github.com/venglow123/presidentielle-2027
repo_name: venglow123/presidentielle-2027
edit_uri: edit/main/docs/

theme:
  name: material
  language: fr
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Passer en mode sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Passer en mode clair

plugins:
  - search:
      lang: fr
  - git-revision-date-localized:
      enable_creation_date: true
      fallback_to_build_date: true

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Accueil: index.md
  - Sujets:
      - sujets/index.md
      - Exemple: sujets/exemple.md
  - Contribuer: contribuer.md
